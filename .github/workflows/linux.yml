name: Linux

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

jobs:
  linux-build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            compiler: g++-11
          - os: ubuntu-24.04
            compiler: g++-12
          - os: ubuntu-24.04
            compiler: g++-13
          - os: ubuntu-24.04
            compiler: g++-14
          - os: ubuntu-26.04
            compiler: g++-15
          - os: ubuntu-26.04
            compiler: g++-16
          - os: ubuntu-24.04
            compiler: clang++-16
          - os: ubuntu-24.04
            compiler: clang++-17
          - os: ubuntu-24.04
            compiler: clang++-18
        build_type: [Release, Debug]
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Install Dependencies
        env:
          compiler: ${{ matrix.platform.compiler }}
        run: |
          set -x
          sudo apt -qq update
          sudo apt -qq install -y ninja-build --no-install-recommends --no-install-suggests
          if [[ "${compiler}" = g++-16 ]]; then
            sudo apt -qq install -y g++-16 --no-install-recommends --no-install-suggests
          fi

      - uses: actions/checkout@v7

      - name: Configure CMake
        run: |
          cmake -S . -B build \
          -GNinja \
          -DCMAKE_CXX_COMPILER=${{ matrix.platform.compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DPEGTL_BUILD_LINT=ON

      - name: Build project
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  linux-ascii:
    name: ASCII (${{ matrix.cxx }}, ${{ matrix.char }} char)
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        char: [signed, unsigned]

    runs-on: ubuntu-24.04

    env:
      CXX: ${{ matrix.cxx }}

    steps:
    - uses: actions/checkout@v7

    - name: Configure CMake
      run: |
        cmake -S . -B build -GNinja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-f${{ matrix.char }}-char" \
          -DPEGTL_BUILD_TESTS=ON \
          -DPEGTL_BUILD_COMPILE_TESTS=OFF \
          -DPEGTL_BUILD_EXAMPLES=OFF

    - name: Build ASCII tests
      run: |
        targets=()
        for source in src/test/ascii_*.cpp; do
          test=${source##*/}
          targets+=("pegtl-test-${test%.cpp}")
        done
        cmake --build build --parallel "$(nproc)" --target "${targets[@]}"

    - name: Run ASCII tests
      run: ctest --test-dir build --output-on-failure --no-tests=error -R '^pegtl-test-ascii_'

  linux-gcc-extra:
    strategy:
      fail-fast: false
      matrix:
        flags: ["-fno-rtti", "-fno-exceptions"]
        build_type: [Debug, Release]

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    # Compile-test fixtures use exception-dependent APIs such as must.
    - run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" -DPEGTL_BUILD_COMPILE_TESTS=${{ matrix.flags != '-fno-exceptions' && 'ON' || 'OFF' }} -DPEGTL_BUILD_LINT=${{ matrix.flags != '-fno-exceptions' && 'ON' || 'OFF' }}

    - run: cmake --build build

    - run: ctest --test-dir build --output-on-failure

  linux-clang-extra:
    strategy:
      fail-fast: false
      matrix:
        flags: ["-fno-rtti", "-fno-exceptions", "-fms-extensions"]
        build_type: [Debug, Release]

    runs-on: ubuntu-24.04

    env:
      CXX: clang++

    steps:
    - uses: actions/checkout@v7

    # Compile-test fixtures use exception-dependent APIs such as must.
    - run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" -DPEGTL_BUILD_COMPILE_TESTS=${{ matrix.flags != '-fno-exceptions' && 'ON' || 'OFF' }} -DPEGTL_BUILD_LINT=${{ matrix.flags != '-fno-exceptions' && 'ON' || 'OFF' }}

    - run: cmake --build build

    - run: ctest --test-dir build --output-on-failure

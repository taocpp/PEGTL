name: clang-analyze

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

jobs:
  clang-analyze:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - run: sudo apt-get update -yq

    - run: sudo apt-get install -yq clang-tools

    - run: scan-build cmake -S . -B build -GNinja

    - run: scan-build cmake --build build

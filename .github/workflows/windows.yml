name: Windows

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

jobs:
  windows-msvc:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4

    - name: Configure Visual Studio Environment
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Configure CMake
      run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build project
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  windows-clang:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v4

    - name: Configure Visual Studio Environment
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Configure CMake
      run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

    - name: Build project
      run: cmake --build build

    - run: ctest --test-dir build --output-on-failure

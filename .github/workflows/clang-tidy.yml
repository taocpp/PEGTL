name: clang-tidy

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get -qq update -yq
        sudo apt-get -qq install -y clang-22 clang-tidy-22 clang-tools-22 libicu-dev --no-install-recommends --no-install-suggests

    - name: Show clang-tidy configuration
      run: |
        clang-tidy-22 --version
        clang-tidy-22 -dump-config

    - name: Generate Compilation Database
      run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPEGTL_BUILD_LINT=ON

    - name: Run clang-tidy on stand-alone headers
      id: headers
      continue-on-error: true
      run: |
        find include/tao/ src/example/ -type f -name '*.hpp' \
          ! -name '*_msvc.hpp' \
          ! -name '*_win32.hpp' \
          -print0 |
          xargs -0 -r -P "$(nproc)" -I '{}' \
            clang-tidy-22 -quiet -header-filter='\.ipp$' '{}' -- -x c++ -std=c++20 -Iinclude

    - name: Run clang-tidy on examples
      id: examples
      continue-on-error: true
      run: run-clang-tidy-22 -p build -quiet -j "$(nproc)" -header-filter='^$' '.*/src/example/.*\.cpp$'

    - name: Run clang-tidy on template instantiations
      id: instantiations
      continue-on-error: true
      run: run-clang-tidy-22 -p build -quiet -j "$(nproc)" -header-filter='(^|/)include/tao/' '.*/src/lint/.*\.cpp$'

    - name: Report clang-tidy failure
      if: steps.headers.outcome == 'failure' || steps.examples.outcome == 'failure' || steps.instantiations.outcome == 'failure'
      run: exit 1

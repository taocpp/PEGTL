name: macOS

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

jobs:
  macos-llvm:
    name: LLVM ${{ matrix.llvm }} (${{ matrix.os }}, ${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - llvm: 18
            build_type: Debug
            os: macos-15
          - llvm: 18
            build_type: Release
            os: macos-15
          - llvm: 20
            build_type: Debug
            os: macos-26
          - llvm: 20
            build_type: Release
            os: macos-26
    runs-on: ${{ matrix.os }}

    steps:
    - name: Install Dependencies
      run: |
        brew update
        brew install llvm@${{ matrix.llvm }}

    - uses: actions/checkout@v7
    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -GNinja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_COMPILER="$(brew --prefix llvm@${{ matrix.llvm }})/bin/clang++"

    - name: Build project
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  macos-appleclang:
    name: AppleClang (${{ matrix.os }}, ${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Show Apple toolchain
      run: |
        xcode-select -p
        xcrun clang++ --version

    - name: Configure CMake
      run: |
        cmake -S . -B build -GNinja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_COMPILER="$(xcrun --find clang++)"

    - name: Build project
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure
